services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccl_suite}
      POSTGRES_USER: ${POSTGRES_USER:-ccl_suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ccl_suite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ccl_suite}
      CCL_ENVIRONMENT: ${CCL_ENVIRONMENT:-development}
      CCL_PUBLIC_URL: ${CCL_PUBLIC_URL:-http://127.0.0.1:8000}
      CCL_SMTP_HOST: ${CCL_SMTP_HOST:-mailpit}
      CCL_SMTP_PORT: ${CCL_SMTP_PORT:-1025}
      CCL_SMTP_STARTTLS: ${CCL_SMTP_STARTTLS:-false}
      CCL_SMTP_USERNAME: ${CCL_SMTP_USERNAME:-}
      CCL_SMTP_PASSWORD: ${CCL_SMTP_PASSWORD:-}
      CCL_MAIL_FROM_ADDRESS: ${CCL_MAIL_FROM_ADDRESS:-no-reply@example.test}
      CCL_PROJECT_ROOT: /app/projects
      CCL_BACKUP_ROOT: /app/backups
    volumes:
      - project_storage:/app/projects
      - backup_storage:/app/backups
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  project_storage:
  backup_storage:
