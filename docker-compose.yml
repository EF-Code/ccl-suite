services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccl_suite}
      POSTGRES_USER: ${POSTGRES_USER:-ccl_suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CCL_DB_BIND_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${CCL_MAILPIT_BIND_PORT:-8025}:8025"

  storage-init:
    image: ccl-suite-api:local
    entrypoint: ["/bin/sh", "/usr/local/bin/prepare-storage.sh"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"
    volumes:
      - project_storage:/app/projects
      - backup_storage:/app/backups
      - database_app_credentials:/app/database-credentials

  db-role-init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/configure_database_role.sh"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ccl_suite}
      PGUSER: ${POSTGRES_USER:-ccl_suite}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CCL_DATABASE_USER: ${CCL_DATABASE_USER:-ccl_app}
      CCL_DATABASE_PASSWORD_FILE: /run/ccl-db-credentials/password
    volumes:
      - database_app_credentials:/run/ccl-db-credentials
      - ./scripts/configure_database_role.sh:/usr/local/bin/configure_database_role.sh:ro

  api:
    image: ccl-suite-api:local
    build: .
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CCL_DATABASE_HOST: db
      CCL_DATABASE_PORT: 5432
      CCL_DATABASE_NAME: ${POSTGRES_DB:-ccl_suite}
      CCL_DATABASE_USER: ${CCL_DATABASE_USER:-ccl_app}
      CCL_DATABASE_PASSWORD_FILE: /run/ccl-db-credentials/password
      CCL_BACKUP_MAX_TOTAL_BYTES: ${CCL_BACKUP_MAX_TOTAL_BYTES:-10737418240}
      CCL_ENVIRONMENT: ${CCL_ENVIRONMENT:-development}
      CCL_PUBLIC_URL: ${CCL_PUBLIC_URL:-http://127.0.0.1:8000}
      CCL_SMTP_HOST: ${CCL_SMTP_HOST:-mailpit}
      CCL_SMTP_PORT: ${CCL_SMTP_PORT:-1025}
      CCL_SMTP_STARTTLS: ${CCL_SMTP_STARTTLS:-false}
      CCL_SMTP_USERNAME: ${CCL_SMTP_USERNAME:-}
      CCL_SMTP_PASSWORD: ${CCL_SMTP_PASSWORD:-}
      CCL_MAIL_FROM_ADDRESS: ${CCL_MAIL_FROM_ADDRESS:-no-reply@example.test}
      CCL_PROJECT_ROOT: /app/projects
      CCL_BACKUP_ROOT: /app/backups
    volumes:
      - project_storage:/app/projects
      - backup_storage:/app/backups
      - database_app_credentials:/run/ccl-db-credentials:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
      db-role-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CCL_API_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  task-reminder-worker:
    image: ccl-suite-api:local
    command: ["python", "-m", "task_reminder_worker"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      CCL_DATABASE_HOST: db
      CCL_DATABASE_PORT: 5432
      CCL_DATABASE_NAME: ${POSTGRES_DB:-ccl_suite}
      CCL_DATABASE_USER: ${CCL_DATABASE_USER:-ccl_app}
      CCL_DATABASE_PASSWORD_FILE: /run/ccl-db-credentials/password
      CCL_TASK_REMINDER_INTERVAL_SECONDS: ${CCL_TASK_REMINDER_INTERVAL_SECONDS:-900}
      CCL_TASK_REMINDER_TIMEZONE: ${CCL_TASK_REMINDER_TIMEZONE:-UTC}
    volumes:
      - database_app_credentials:/run/ccl-db-credentials:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  project_storage:
  backup_storage:
  database_app_credentials:
